openapi: 3.1.0
info:
  title: Moyro Native API
  version: 0.2.7
  description: |
    Moyro Flow, durable activity inbox, lifecycle-aware work items, message
    automation, permission-scoped knowledge retrieval, conversation-derived
    documents, safe approval previews, and service policy endpoints under
    `/api/moyro/v1`.
    This contract is intentionally separate from `openapi-v4.yaml`, which
    documents the Mattermost-compatible `/api/v4` boundary.

    First-party browser requests use an HttpOnly same-origin session cookie;
    API, PAT, and managed-key clients use `Authorization: Bearer`. Protected
    native endpoints reject credentials supplied through the `access_token`
    query parameter. Cookie-authenticated mutations also require the configured
    same-origin `Origin` value.
servers:
  - url: /api/moyro/v1
    description: Native API on the current Moyro deployment origin
tags:
  - name: Authentication
    description: Browser-bound completion of an external identity login.
  - name: OIDC
    description: Public browser sign-in and administrator-managed Keycloak configuration.
  - name: System
    description: Public build metadata and client capabilities.
  - name: Settings
    description: Administrator-owned site and browser policy.
  - name: Operations
    description: Evidence-backed administrator diagnostics for durable runtime state.
  - name: Flow
    description: User-scoped navigation and unread read models.
  - name: Activity
    description: Durable personal inbox events and their state.
  - name: Work items
    description: Tasks and decisions derived from accessible conversations.
  - name: Automations
    description: User-owned message rules and durable execution history.
  - name: Knowledge
    description: Permission-scoped message and document retrieval with citation sources.
  - name: Documents
    description: Source-watermarked documents derived from live conversation threads.
  - name: Inbox preferences
    description: User-owned priority, bundling, snooze, and work-hours rules.
  - name: OIDC onboarding
    description: Administrator-managed identity-provider group onboarding targets.
  - name: Approvals
    description: Protected MCP requests and display-safe review projections.
security:
  - bearerAuth: []
  - browserSession: []
paths:
  /auth/session/login:
    post:
      operationId: createBrowserSession
      tags: [Authentication]
      security: []
      summary: Authenticate the first-party web client with an HttpOnly session
      description: |
        Same-origin browser endpoint. The reusable session credential is set in
        an HttpOnly, SameSite cookie and is never returned in JSON or a response
        token header. API clients should continue using `/api/v4/users/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login_id, password]
              properties:
                login_id: { type: string }
                password: { type: string, format: password }
                device_id: { type: string }
      responses:
        "201":
          description: Browser session created
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /auth/session/adopt:
    post:
      operationId: adoptLegacyBrowserSession
      tags: [Authentication]
      security:
        - bearerAuth: []
      summary: Move a legacy browser bearer session into an HttpOnly cookie
      description: |
        One-release migration endpoint for an existing browser session stored
        by an older web client. A valid session Bearer token is required once;
        the response sets the browser cookie and does not echo the credential.
      responses:
        "200":
          description: Browser session adopted
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/session/logout:
    post:
      operationId: revokeBrowserSession
      tags: [Authentication]
      summary: Revoke the current session and clear its browser cookie
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/oidc/login:
    get:
      operationId: beginOIDCLogin
      tags: [OIDC]
      security: []
      summary: Begin a browser-bound Keycloak authorization-code flow
      description: |
        Captures the active immutable provider snapshot and onboarding policy,
        creates a one-time PKCE transaction, and redirects the browser to the
        provider. The transaction is also bound to an HttpOnly cookie. An
        optional return path is accepted only when it is a safe same-origin
        absolute path; invalid values are replaced by `/`.
      parameters:
        - name: return_to
          in: query
          required: false
          description: Same-origin absolute path to restore after successful login.
          schema: { type: string, maxLength: 2048, example: "/work" }
      responses:
        "302":
          description: Redirect to the provider authorization endpoint
          headers:
            Location:
              schema: { type: string, format: uri }
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/oidc/callback:
    get:
      operationId: completeOIDCCallback
      tags: [OIDC]
      security: []
      summary: Complete the Keycloak callback and issue a browser handoff code
      description: |
        Consumes the state and HttpOnly transaction cookie, exchanges the
        authorization code against the provider snapshot captured at login,
        resolves the local account, and applies the captured group mappings.
        Every success or failure is returned as a `302`: success appends a
        five-minute opaque `sso_code` to the destination URL fragment and sets
        its independent HttpOnly binding cookie; failure redirects to
        `/login#oauth_error=<safe-code>`. Call `POST /auth/sso/session` next to
        create the reusable local browser session.
      parameters:
        - name: state
          in: query
          description: Opaque state returned by the provider.
          schema: { type: string }
        - name: code
          in: query
          description: Authorization code returned on provider success.
          schema: { type: string }
        - name: error
          in: query
          description: Provider error code returned instead of `code`.
          schema: { type: string }
        - name: error_description
          in: query
          description: Provider-supplied diagnostic text; never forwarded verbatim to the browser fragment.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the requested local path or to the login error view
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              description: Clears the transaction cookie and, on success, sets the handoff binding.
              schema: { type: string }
  /auth/sso/session:
    post:
      operationId: exchangeBrowserSSOSession
      tags: [Authentication]
      security: []
      summary: Exchange a browser-bound SSO code for an HttpOnly local session
      description: |
        OAuth and OIDC callbacks place a five-minute opaque code in the browser
        fragment and an independent binding in an HttpOnly, path-restricted
        cookie. Both must match the same live PostgreSQL row. A successful
        exchange atomically creates a session and returns only the local user;
        the reusable credential is set only in an HttpOnly cookie. The same
        browser binding can recover the identical session for 60 seconds if a
        successful response is lost, without minting a second session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Authenticated
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /system/info:
    get:
      operationId: getSystemInfo
      tags: [System]
      summary: Read public build and capability information
      description: |
        Returns only public service metadata. Draft capability values are the
        effective administrator policy consumed by the web client.
      security: []
      responses:
        "200":
          description: Public service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /admin/settings/site:
    get:
      operationId: getSiteSettings
      tags: [Settings]
      summary: Read site and browser-draft policy
      description: Requires the `manage_settings` permission.
      responses:
        "200":
          description: Current site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateSiteSettings
      tags: [Settings]
      summary: Replace site and browser-draft policy
      description: |
        Requires `manage_settings`. Although the method is PATCH, the handler
        decodes a complete settings view over server defaults. Send every field
        to avoid unintentionally restoring an omitted value to its default.
        `public_base_url` cannot be cleared while Keycloak is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Normalized and stored site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/operations:
    get:
      operationId: getAdminOperations
      tags: [Operations]
      summary: Read evidence-backed operational state
      description: |
        Requires `manage_system`. Database, migration, queue, webhook-delivery,
        and file-metadata values come from the current PostgreSQL state and
        selected storage runtime. A subsystem remains `unknown` when Moyro has
        no heartbeat or connection probe that can prove it healthy; an empty
        queue is not reported as a running worker.
      responses:
        "200":
          description: Current operational snapshot
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOperationsSnapshot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/oidc/providers:
    get:
      operationId: listOIDCProviders
      tags: [OIDC]
      summary: List configured OIDC providers
      description: |
        Requires `manage_oidc`. Moyro currently supports one provider with the
        stable id `keycloak`; an unconfigured deployment returns an empty array.
        Stored client-secret material is never returned.
      responses:
        "200":
          description: Configured providers, or an empty array
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items: { $ref: "#/components/schemas/OIDCProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createOIDCProvider
      tags: [OIDC]
      summary: Save the Keycloak provider configuration
      description: |
        Requires `manage_oidc`. Omitted identity and claim fields use Keycloak
        defaults. Enabling the provider requires a configured public base URL,
        client secret, and successful discovery. Discovery is completed before
        settings are committed and the exact prepared snapshot is then activated.
        Sending an empty `client_secret` preserves the stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCProviderSaveRequest" }
      responses:
        "200":
          description: Normalized and stored provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/oidc/providers/{providerID}:
    parameters:
      - $ref: "#/components/parameters/OIDCProviderID"
    patch:
      operationId: updateOIDCProvider
      tags: [OIDC]
      summary: Replace the Keycloak provider configuration
      description: |
        Requires `manage_oidc`. Although the method is PATCH, the handler
        decodes a complete view over server defaults; clients should send every
        editable field. An empty `client_secret` preserves the stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCProviderSaveRequest" }
      responses:
        "200":
          description: Normalized and stored provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/oidc/providers/test:
    post:
      operationId: testOIDCProvider
      tags: [OIDC]
      summary: Probe OIDC discovery without storing or activating the provider
      description: |
        Requires `manage_oidc`. The probe validates the issuer and discovery
        document. It does not require or test the client secret. Insecure HTTP
        discovery is rejected unless `allow_insecure_backchannel` is explicitly
        enabled for an offline or development deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OIDCProviderSaveRequest" }
      responses:
        "200":
          description: Discovery succeeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCProviderTestResult" }
        "400":
          description: Invalid request or discovery failed
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/OIDCProviderTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/oidc/onboarding-targets:
    get:
      operationId: listOIDCOnboardingTargets
      tags: [OIDC onboarding]
      summary: List active teams and channels available to OIDC group mappings
      description: |
        Requires `manage_oidc`. Archived teams/channels and direct or group
        message channels are omitted, so saved mappings cannot target them.
      responses:
        "200":
          description: Current mapping destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OIDCOnboardingTargets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/flow-summary:
    get:
      operationId: getFlowSummary
      tags: [Flow]
      summary: Read the current user's Flow navigation model
      description: |
        Returns accessible teams, active team channels, membership counters,
        and up to six priority unread channels in one request. Browser sessions
        use their live memberships. Restricted API keys additionally require
        the current `mcp_read` grant and remain bounded by their team/channel
        scopes. Direct and group-message channels are not included in this read
        model.
      responses:
        "200":
          description: User-scoped Flow summary
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/activity-events:
    get:
      operationId: listActivityEvents
      tags: [Activity]
      summary: List durable activity inbox events
      description: |
        Events are always constrained to the authenticated owner. Channel-bound
        events disappear from subsequent reads if that user loses access to the
        channel. The cursor is opaque and orders rows by `(create_at, id)`
        descending. Repeated `type` parameters and comma-separated type values
        are both accepted.
      parameters:
        - $ref: "#/components/parameters/ActivityCursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: unread
          in: query
          schema: { type: boolean, default: false }
        - name: type
          in: query
          description: Event type filter; repeat the parameter to select several types.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ActivityEventType" }
      responses:
        "200":
          description: Cursor page of safe, owner-scoped activity views
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEventPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/activity-events/{eventID}:
    patch:
      operationId: updateActivityEventState
      tags: [Activity]
      summary: Update read, completed, or snooze state
      description: |
        Only the authenticated owner's row can be changed. Foreign and
        inaccessible channel events are returned as not found.
      parameters:
        - $ref: "#/components/parameters/EventID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityStatePatch"
      responses:
        "200":
          description: Updated activity event
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEvent"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/activity-events/mark-read:
    post:
      operationId: markActivityEventsRead
      tags: [Activity]
      summary: Mark several activity events read
      description: |
        Updates at most 200 owner-scoped events. Foreign, missing, or no-longer
        accessible event IDs are indistinguishable no-ops and are not included
        in the returned count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityMarkReadRequest"
      responses:
        "200":
          description: Number of rows newly marked read
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityMarkReadResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/work-items:
    get:
      operationId: listWorkItems
      tags: [Work items]
      summary: List accessible tasks and decisions
      description: |
        Tasks are visible only to their creator or current assignee. Decisions
        are visible to current members of the source channel. Removed channel
        membership removes both kinds from future reads. When `status` is
        supplied, a matching `kind` is required. `sort=due` is available for
        dated tasks; otherwise the cursor sorts by `(create_at, id)` descending.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/WorkItemKind" }
        - name: status
          in: query
          description: Must be valid for the accompanying kind.
          schema: { $ref: "#/components/schemas/WorkItemStatus" }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 1024 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
        - name: due_from
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: due_to
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: sort
          in: query
          schema: { type: string, enum: [created, due], default: created }
      responses:
        "200":
          description: Cursor page of work items
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createWorkItem
      tags: [Work items]
      summary: Create a task or record a decision from a message
      description: |
        The server derives team, channel, and root-thread scope from the live
        source post and rechecks source-channel membership. A task assignee must
        be an active channel member; an omitted task assignee defaults to the
        caller. Tasks can carry priority, recurrence, and accessible task
        dependencies. Decisions use proposal/review/record lifecycle fields,
        may supersede an existing recorded decision, and can identify impacted
        accessible tasks.

        An idempotency key of 1–200 characters is required in either the
        `Idempotency-Key` header or `idempotency_key` body field. If both are
        sent they must match. Replaying the same actor/key with every durable
        input unchanged returns `200` and `replayed: true`; reuse for different
        input or a deleted item returns `409`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItem"
      responses:
        "201":
          description: Newly created work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkItemResult"
        "200":
          description: Idempotent replay of the original work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkItemResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/work-items/{workItemID}:
    patch:
      operationId: updateWorkItem
      tags: [Work items]
      summary: Update a task or decision
      description: |
        The creator can change owner-controlled fields. A current task assignee
        can change status only. A configured decision reviewer may advance the
        lifecycle but cannot change owner fields. Task completion is rejected
        while a non-terminal dependency remains. Guessed task IDs that are not
        visible to the caller are returned as not found.
      parameters:
        - $ref: "#/components/parameters/WorkItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWorkItem"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteWorkItem
      tags: [Work items]
      summary: Delete a work item
      description: Only the creator, while still a source-channel member, can delete it.
      parameters:
        - $ref: "#/components/parameters/WorkItemID"
      responses:
        "204":
          description: Work item deleted; no response body
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/work-items/{workItemID}/events:
    get:
      operationId: listWorkItemEvents
      tags: [Work items]
      summary: Read the immutable lifecycle history of a visible work item
      parameters:
        - $ref: "#/components/parameters/WorkItemID"
      responses:
        "200":
          description: Chronological lifecycle events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkItemEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/work-items/{workItemID}/dependencies/{dependencyID}:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - $ref: "#/components/parameters/DependencyID"
    post:
      operationId: addWorkItemDependency
      tags: [Work items]
      summary: Add an accessible task dependency without creating a cycle
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: removeWorkItemDependency
      tags: [Work items]
      summary: Remove a task dependency
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/work-items/{workItemID}/impacts/{taskID}:
    parameters:
      - $ref: "#/components/parameters/WorkItemID"
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: addDecisionImpact
      tags: [Work items]
      summary: Link a decision to an accessible impacted task
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: removeDecisionImpact
      tags: [Work items]
      summary: Remove an impacted-task link
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/automation-rules:
    get:
      operationId: listAutomationRules
      tags: [Automations]
      summary: List message rules owned by the current user
      responses:
        "200":
          description: Active rules with their ordered actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createAutomationRule
      tags: [Automations]
      summary: Create a bounded channel-message automation
      description: |
        The owner must currently belong to the source channel. A matching post
        and its action-run rows commit atomically; the offline worker retries
        failed actions using stable run identities.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAutomationRule" }
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/automation-rules/{ruleID}:
    parameters:
      - $ref: "#/components/parameters/AutomationRuleID"
    patch:
      operationId: updateAutomationRule
      tags: [Automations]
      summary: Replace a rule using its expected revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAutomationRule" }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteAutomationRule
      tags: [Automations]
      summary: Disable a rule and cancel its pending runs
      responses:
        "204": { description: Rule deleted; no response body }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/automation-rules/{ruleID}/runs:
    get:
      operationId: listAutomationRuns
      tags: [Automations]
      summary: List durable execution history for an owned rule
      parameters:
        - $ref: "#/components/parameters/AutomationRuleID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Newest execution runs first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/knowledge/search:
    post:
      operationId: searchKnowledge
      tags: [Knowledge]
      summary: Search live accessible messages and derived documents
      description: |
        Search is performed entirely in PostgreSQL and re-evaluates current
        team/channel membership and restricted-key allow-lists. References such
        as `M1` and `D1` identify authoritative source cards in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeSearchInput" }
      responses:
        "200":
          description: Permission-filtered ranked sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: List conversation-derived documents still visible to the user
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Visible documents with live stale-source status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createDocument
      tags: [Documents]
      summary: Create a document from an unchanged live conversation thread
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocument" }
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDocumentResult" }
        "201":
          description: Document created with a source snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDocumentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/documents/{documentID}:
    parameters:
      - $ref: "#/components/parameters/DocumentID"
    get:
      operationId: getDocument
      tags: [Documents]
      summary: Read one currently accessible document
      responses:
        "200":
          description: Document with live stale-source status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateDocument
      tags: [Documents]
      summary: Update owned content using optimistic revision control
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchDocument" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteDocument
      tags: [Documents]
      summary: Delete an owned document using optimistic revision control
      parameters:
        - name: revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Document deleted; no response body }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/document-sources/{postID}:
    get:
      operationId: getDocumentSource
      tags: [Documents]
      summary: Resolve a post to its complete live source thread
      parameters:
        - $ref: "#/components/parameters/PostID"
      responses:
        "200":
          description: Ordered source posts and opaque content revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/inbox-preferences:
    get:
      operationId: getInboxPreferences
      tags: [Inbox preferences]
      summary: Read normalized personal inbox and notification rules
      responses:
        "200":
          description: Stored preferences or offline-safe defaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateInboxPreferences
      tags: [Inbox preferences]
      summary: Partially update personal priority, bundling, snooze, and work-hours rules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchInboxPreferences" }
      responses:
        "200":
          description: Normalized saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/approval-requests:
    get:
      operationId: listOwnApprovalRequests
      tags: [Approvals]
      summary: List approval requests submitted by the current user
      description: |
        Returns display-oriented projections. Durable execution payloads and
        producer-private credential metadata are never included.
      parameters:
        - $ref: "#/components/parameters/ApprovalStatus"
      responses:
        "200":
          description: Up to 100 approval request views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalRequestView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: submitApprovalRequest
      tags: [Approvals]
      summary: Submit a supported protected MCP write
      description: |
        Requires a currently valid scoped MCP key with `mcp_write` and
        `request_approval` in the destination channel. The supported actions
        are `mcp.create_post` and `mcp.reply_to_thread`. The response contains
        a safe preview only; the raw execution payload is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApprovalRequest"
      responses:
        "200":
          description: Approval requirement and optional safe request view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResultView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /reviews/approval-requests:
    get:
      operationId: listReviewApprovalRequests
      tags: [Approvals]
      summary: List approval requests the current principal can review
      description: |
        Team/channel scope and `review_approval` are evaluated for every row.
        Self-review exclusions configured by policy are also applied.
      parameters:
        - $ref: "#/components/parameters/ApprovalStatus"
      responses:
        "200":
          description: Up to 100 safe approval request views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalRequestView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /reviews/approval-requests/{requestID}/decision:
    post:
      operationId: decideApprovalRequest
      tags: [Approvals]
      summary: Approve or reject an in-scope request
      description: |
        Requires current `review_approval` in the request resource scope. An
        approved request is executed through the MCP approved-action path
        before the response is returned. The response remains the safe view
        without the raw durable payload.
      parameters:
        - $ref: "#/components/parameters/ApprovalRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated safe approval request view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT, PAT, or scoped Moyro API key
    browserSession:
      type: apiKey
      in: cookie
      name: moyro_browser_session
  parameters:
    EventID:
      name: eventID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkItemID:
      name: workItemID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DependencyID:
      name: dependencyID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    TaskID:
      name: taskID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    OIDCProviderID:
      name: providerID
      in: path
      required: true
      description: Moyro currently supports the single built-in Keycloak provider.
      schema: { type: string, const: keycloak }
    AutomationRuleID:
      name: ruleID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DocumentID:
      name: documentID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PostID:
      name: postID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ApprovalRequestID:
      name: requestID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ActivityCursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `next_cursor` by the preceding page.
      schema: { type: string, maxLength: 1024 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required here or in the body; if both are sent, values must match.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ApprovalStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [pending, approved, rejected, expired, executed]
  responses:
    BadRequest:
      description: Invalid query, JSON body, cursor, or domain input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, expired, invalid, or disallowed credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Current principal lacks the required permission or resource scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource is absent or intentionally hidden from this principal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Optimistic revision, idempotency, dependency-cycle, or lifecycle precondition conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The complete live source thread exceeds the bounded snapshot size
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Server could not complete the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Required native service is not configured or available
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [id, message, status_code]
      properties:
        id: { type: string }
        message: { type: string }
        detailed_error: { type: string }
        request_id: { type: string }
        status_code: { type: integer, minimum: 400, maximum: 599 }
    LoginUser:
      type: object
      additionalProperties: false
      required: [id, username, email, roles, picture, guest_file_download]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        roles: { type: string }
        picture: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        nickname: { type: string }
        position: { type: string }
        guest_expires_at:
          type: integer
          format: int64
          minimum: 1
          description: Unix-millisecond expiry for a restricted guest; omitted for regular users.
        guest_file_download:
          type: boolean
          description: Whether a restricted guest may download original file bytes.
    BrowserLoginSession:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/LoginUser" }
    OIDCSecretState:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured: { type: boolean }
    OIDCGroupMapping:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact provider group matched case-insensitively after trimming.
        account_role:
          type: string
          enum: [user, admin, guest]
          default: user
        team_id:
          type: string
          maxLength: 128
          description: Active team to add; required for mappings with channels and for guests.
        team_role:
          type: string
          enum: [member, admin]
          default: member
        channel_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        channel_role:
          type: string
          enum: [member, admin]
          default: member
        guest_expires_after_seconds:
          oneOf:
            - { type: integer, format: int64, const: 0 }
            - { type: integer, format: int64, minimum: 3600, maximum: 31536000 }
          description: For guest mappings, zero selects 30 days and explicit values must be 3600–31536000.
        guest_file_download:
          type: boolean
          default: false
      allOf:
        - if:
            properties:
              account_role: { const: guest }
            required: [account_role]
          then:
            required: [team_id, channel_ids]
            properties:
              team_id: { type: string, minLength: 1, maxLength: 128 }
              channel_ids: { type: array, minItems: 1, maxItems: 100 }
              team_role: { type: string, const: member }
              channel_role: { type: string, const: member }
    OIDCProviderSaveRequest:
      type: object
      description: The compatibility decoder ignores unknown fields; clients should send only the documented configuration properties.
      properties:
        id: { type: string, const: keycloak, default: keycloak }
        kind: { type: string, const: keycloak, default: keycloak }
        name: { type: string, default: Keycloak }
        enabled: { type: boolean, default: false }
        issuer_url:
          type: string
          description: Absolute HTTP(S) issuer URL; a trailing discovery-document suffix is normalized away.
        client_id: { type: string }
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: Required when first enabling; an empty value preserves an existing encrypted secret.
        scopes:
          type: array
          items: { type: string }
          default: [openid, profile, email]
          description: Empty values and duplicates are removed; `openid` is always included.
        username_claim: { type: string, default: preferred_username }
        email_claim: { type: string, default: email }
        groups_claim: { type: string, default: groups }
        group_mappings:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OIDCGroupMapping" }
        ca_certificate_pem:
          type: string
          description: Optional private CA bundle used only for provider backchannel requests.
        allow_signup: { type: boolean, default: true }
        require_verified_email: { type: boolean, default: true }
        allow_insecure_backchannel:
          type: boolean
          default: false
          description: Permit HTTP token, JWKS, and user-info endpoints for a trusted private network; authorization remains HTTPS-only when the issuer is HTTPS.
    OIDCProvider:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - enabled
        - issuer_url
        - client_id
        - scopes
        - username_claim
        - email_claim
        - groups_claim
        - group_mappings
        - allow_signup
        - require_verified_email
        - allow_insecure_backchannel
      properties:
        id: { type: string, const: keycloak }
        kind: { type: string, const: keycloak }
        name: { type: string }
        enabled: { type: boolean }
        issuer_url: { type: string }
        client_id: { type: string }
        client_secret_state: { $ref: "#/components/schemas/OIDCSecretState" }
        scopes:
          type: array
          items: { type: string }
        username_claim: { type: string }
        email_claim: { type: string }
        groups_claim: { type: string }
        group_mappings:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OIDCGroupMapping" }
        ca_certificate_pem: { type: string }
        allow_signup: { type: boolean }
        require_verified_email: { type: boolean }
        allow_insecure_backchannel: { type: boolean }
        redirect_url: { type: string, format: uri }
