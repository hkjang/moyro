        team_id: { type: string }
        channel_id: { type: string, minLength: 1, maxLength: 128 }
        enabled: { type: boolean }
        match_type: { $ref: "#/components/schemas/AutomationMatchType" }
        match_value: { type: string, minLength: 1, maxLength: 200 }
        revision: { type: integer, format: int64, minimum: 1 }
        actions:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/AutomationAction" }
        create_at: { type: integer, format: int64, minimum: 1 }
        update_at: { type: integer, format: int64, minimum: 1 }
        delete_at: { type: integer, format: int64, minimum: 0 }
    AutomationRun:
      type: object
      additionalProperties: false
      required:
        - id
        - rule_id
        - action_id
        - post_id
        - actor_id
        - action_type
        - status
        - attempt_count
        - next_attempt_at
        - create_at
        - update_at
      properties:
        id: { type: string }
        rule_id: { type: string }
        action_id: { type: string }
        post_id: { type: string }
        actor_id: { type: string }
        action_type: { $ref: "#/components/schemas/AutomationActionType" }
        status: { type: string, enum: [pending, processing, retry, succeeded, dead, cancelled] }
        attempt_count: { type: integer, minimum: 0 }
        next_attempt_at: { type: integer, format: int64, minimum: 0 }
        claimed_at: { type: integer, format: int64, minimum: 0 }
        lease_until: { type: integer, format: int64, minimum: 0 }
        result_type: { type: string }
        result_id: { type: string }
        last_error_code: { type: string }
        last_error_text: { type: string, maxLength: 1000 }
        create_at: { type: integer, format: int64, minimum: 1 }
        update_at: { type: integer, format: int64, minimum: 1 }
        completed_at: { type: integer, format: int64, minimum: 0 }
    KnowledgeSearchInput:
      type: object
      additionalProperties: false
      required: [query, team_id]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        team_id: { type: string, minLength: 1, maxLength: 128 }
        channel_id: { type: string, minLength: 1, maxLength: 128 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    KnowledgeSource:
      type: object
      additionalProperties: false
      required:
        - ref
        - kind
        - id
        - channel_id
        - excerpt
        - author_id
        - author_name
        - create_at
        - update_at
        - rank
      properties:
        ref: { type: string, pattern: "^[MD][1-9][0-9]*$" }
        kind: { type: string, enum: [message, document] }
        id: { type: string }
        team_id: { type: string }
        channel_id: { type: string }
        post_id: { type: string }
        document_id: { type: string }
        source_thread_id: { type: string }
        title: { type: string }
        excerpt: { type: string, maxLength: 1201 }
        author_id: { type: string }
        author_name: { type: string }
        create_at: { type: integer, format: int64, minimum: 1 }
        update_at: { type: integer, format: int64, minimum: 0 }
        rank: { type: number, format: double }
    KnowledgeSearchResult:
      type: object
      additionalProperties: false
      required: [sources, total_hits]
      properties:
        sources:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/KnowledgeSource" }
        total_hits: { type: integer, minimum: 0 }
    Document:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - body
        - created_by
        - channel_id
        - source_thread_id
        - source_cursor_at
        - revision
        - create_at
        - update_at
        - delete_at
        - stale
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 240 }
        body: { type: string, minLength: 1, maxLength: 100000 }
        created_by: { type: string }
        team_id: { type: string }
        channel_id: { type: string }
        source_thread_id: { type: string }
        source_cursor_at:
          type: integer
          format: int64
          minimum: 1
          description: Opaque content revision; it is not a timestamp.
        revision: { type: integer, format: int64, minimum: 1 }
        create_at: { type: integer, format: int64, minimum: 1 }
        update_at: { type: integer, format: int64, minimum: 1 }
        delete_at: { type: integer, format: int64, minimum: 0 }
        stale: { type: boolean }
    DocumentSourcePost:
      type: object
      additionalProperties: false
      required: [id, channel_id, user_id, username, root_id, message, create_at, update_at]
      properties:
        id: { type: string }
        channel_id: { type: string }
        user_id: { type: string }
        username: { type: string }
        root_id: { type: string }
        message: { type: string }
        create_at: { type: integer, format: int64, minimum: 1 }
        update_at: { type: integer, format: int64, minimum: 0 }
    DocumentSource:
      type: object
      additionalProperties: false
      required: [channel_id, thread_id, cursor_at, posts]
      properties:
        team_id: { type: string }
        channel_id: { type: string }
        thread_id: { type: string }
        cursor_at:
          type: integer
          format: int64
          minimum: 1
          description: Opaque content revision; it is not a timestamp.
        posts:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/DocumentSourcePost" }
    CreateDocument:
      type: object
      additionalProperties: false
      required: [title, body, source_post_id, source_cursor_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        body: { type: string, minLength: 1, maxLength: 100000 }
        source_post_id: { type: string, minLength: 1, maxLength: 128 }
        source_cursor_at: { type: integer, format: int64, minimum: 1 }
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
          description: Required when the Idempotency-Key header is omitted.
    CreateDocumentResult:
      type: object
      additionalProperties: false
      required: [document, replayed]
      properties:
        document: { $ref: "#/components/schemas/Document" }
        replayed: { type: boolean }
    PatchDocument:
      type: object
      additionalProperties: false
      required: [expected_revision]
      anyOf:
        - required: [title]
        - required: [body]
        - required: [source_cursor_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        body: { type: string, minLength: 1, maxLength: 100000 }
        source_cursor_at: { type: integer, format: int64, minimum: 1 }
        expected_revision: { type: integer, format: int64, minimum: 1 }
    InboxPreferencesFields:
      type: object
      properties:
        vip_user_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        priority_event_types:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { $ref: "#/components/schemas/ActivityEventType" }
        bundle_by: { type: string, enum: [none, channel, type] }
        snooze_presets_minutes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: integer, minimum: 5, maximum: 43200 }
        work_hours_enabled: { type: boolean }
        work_hours_timezone: { type: string, minLength: 1, maxLength: 128 }
        work_hours_weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        work_hours_start_minute: { type: integer, minimum: 0, maximum: 1439 }
        work_hours_end_minute: { type: integer, minimum: 0, maximum: 1439 }
        priority_override: { type: boolean }
    InboxPreferences:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/InboxPreferencesFields"
        - type: object
          required:
            - vip_user_ids
            - priority_event_types
            - bundle_by
            - snooze_presets_minutes
            - work_hours_enabled
            - work_hours_timezone
            - work_hours_weekdays
            - work_hours_start_minute
            - work_hours_end_minute
            - priority_override
            - update_at
          properties:
            update_at: { type: integer, format: int64, minimum: 0 }
    PatchInboxPreferences:
      unevaluatedProperties: false
      minProperties: 1
      allOf:
        - $ref: "#/components/schemas/InboxPreferencesFields"
    OIDCOnboardingChannelTarget:
      type: object
      additionalProperties: false
      required: [id, team_id, name, display_name, type]
      properties:
        id: { type: string }
        team_id: { type: string }
        name: { type: string }
        display_name: { type: string }
        type: { type: string, enum: [O, P] }
    OIDCOnboardingTeamTarget:
      type: object
      additionalProperties: false
      required: [id, name, display_name, channels]
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        channels:
          type: array
          items: { $ref: "#/components/schemas/OIDCOnboardingChannelTarget" }
    OIDCOnboardingTargets:
      type: object
      additionalProperties: false
      required: [teams]
      properties:
        teams:
          type: array
          items: { $ref: "#/components/schemas/OIDCOnboardingTeamTarget" }
    ApprovalAction:
      type: string
      enum: [mcp.create_post, mcp.reply_to_thread]
    ApprovalPreviewActor:
      type: object
      additionalProperties: false
      required: [type, display_name]
      properties:
        type: { type: string, enum: [mcp_key, automation] }
        display_name: { type: string }
    ApprovalPreviewTarget:
      type: object
      additionalProperties: false
      required: [type, display_name]
      properties:
        type: { type: string, enum: [channel, team, resource] }
        display_name: { type: string }
    ApprovalPreviewChange:
      type: object
      additionalProperties: false
      required: [label, after]
      properties:
        label: { type: string }
        after:
          type: string
          maxLength: 4000
          description: Server-redacted and bounded display text.
    ApprovalPreviewPolicy:
      type: object
      additionalProperties: false
      required: [name, reason]
      properties:
        name: { type: string }
        reason: { type: string }
    ApprovalPreview:
      type: object
      additionalProperties: false
      required: [title, risk_level, actor, target, changes, policy, secrets_redacted]
      properties:
        title: { type: string }
        risk_level: { type: string, enum: [medium, unknown] }
        actor: { $ref: "#/components/schemas/ApprovalPreviewActor" }
        target: { $ref: "#/components/schemas/ApprovalPreviewTarget" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/ApprovalPreviewChange" }
        policy: { $ref: "#/components/schemas/ApprovalPreviewPolicy" }
        secrets_redacted:
          type: boolean
          const: true
          description: Raw durable payload is never part of the view.
    ApprovalRequestView:
      type: object
      additionalProperties: false
      required:
        - id
        - policy_id
        - action_type
        - requester_id
        - team_id
        - resource_type
        - resource_id
        - status
        - create_at
        - update_at
        - decided_at
        - executed_at
        - expires_at
        - preview
      properties:
        id: { type: string }
        policy_id: { type: string }
        action_type: { $ref: "#/components/schemas/ApprovalAction" }
        requester_id: { type: string }
        team_id: { type: string }
        resource_type: { type: string, enum: [channel, team] }
        resource_id: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired, executed] }
        idempotency_key: { type: string }
        create_at: { type: integer, format: int64, minimum: 0 }
        update_at: { type: integer, format: int64, minimum: 0 }
        decided_at: { type: integer, format: int64, minimum: 0 }
        executed_at: { type: integer, format: int64, minimum: 0 }
        expires_at: { type: integer, format: int64, minimum: 0 }
        preview: { $ref: "#/components/schemas/ApprovalPreview" }
    SubmitApprovalRequest:
      type: object
      required: [action_type, resource_type, resource_id, payload]
      properties:
        action_type: { $ref: "#/components/schemas/ApprovalAction" }
        team_id: { type: string }
        resource_type: { type: string, const: channel }
        resource_id: { type: string, minLength: 1 }
        payload:
          type: object
          required: [channel_id, message]
          properties:
            channel_id: { type: string, minLength: 1 }
            message: { type: string, minLength: 1 }
            root_id:
              type: string
              description: Required and source-channel validated for mcp.reply_to_thread.
          additionalProperties: true
        idempotency_key: { type: string }
    ApprovalResultView:
      type: object
      additionalProperties: false
      required: [approval_required]
      properties:
        approval_required: { type: boolean }
        request: { $ref: "#/components/schemas/ApprovalRequestView" }
    ApprovalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason:
          type: string
          description: Required for rejection when the matching policy requires it.
