openapi: 3.1.0
info:
  title: Moyro Native API
  version: 0.2.5
  description: |
    Moyro Flow, durable activity inbox, conversation-derived work items, safe
    approval previews, and service policy endpoints under `/api/moyro/v1`.
    This contract is intentionally separate from `openapi-v4.yaml`, which
    documents the Mattermost-compatible `/api/v4` boundary.

    First-party browser requests use an HttpOnly same-origin session cookie;
    API, PAT, and managed-key clients use `Authorization: Bearer`. Protected
    native endpoints reject credentials supplied through the `access_token`
    query parameter. Cookie-authenticated mutations also require the configured
    same-origin `Origin` value.
servers:
  - url: /api/moyro/v1
    description: Native API on the current Moyro deployment origin
tags:
  - name: Authentication
    description: Browser-bound completion of an external identity login.
  - name: System
    description: Public build metadata and client capabilities.
  - name: Settings
    description: Administrator-owned site and browser policy.
  - name: Operations
    description: Evidence-backed administrator diagnostics for durable runtime state.
  - name: Flow
    description: User-scoped navigation and unread read models.
  - name: Activity
    description: Durable personal inbox events and their state.
  - name: Work items
    description: Tasks and decisions derived from accessible conversations.
  - name: Approvals
    description: Protected MCP requests and display-safe review projections.
security:
  - bearerAuth: []
  - browserSession: []
paths:
  /auth/session/login:
    post:
      operationId: createBrowserSession
      tags: [Authentication]
      security: []
      summary: Authenticate the first-party web client with an HttpOnly session
      description: |
        Same-origin browser endpoint. The reusable session credential is set in
        an HttpOnly, SameSite cookie and is never returned in JSON or a response
        token header. API clients should continue using `/api/v4/users/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login_id, password]
              properties:
                login_id: { type: string }
                password: { type: string, format: password }
                device_id: { type: string }
      responses:
        "201":
          description: Browser session created
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /auth/session/adopt:
    post:
      operationId: adoptLegacyBrowserSession
      tags: [Authentication]
      security:
        - bearerAuth: []
      summary: Move a legacy browser bearer session into an HttpOnly cookie
      description: |
        One-release migration endpoint for an existing browser session stored
        by an older web client. A valid session Bearer token is required once;
        the response sets the browser cookie and does not echo the credential.
      responses:
        "200":
          description: Browser session adopted
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/session/logout:
    post:
      operationId: revokeBrowserSession
      tags: [Authentication]
      summary: Revoke the current session and clear its browser cookie
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/sso/session:
    post:
      operationId: exchangeBrowserSSOSession
      tags: [Authentication]
      security: []
      summary: Exchange a browser-bound SSO code for an HttpOnly local session
      description: |
        OAuth and OIDC callbacks place a five-minute opaque code in the browser
        fragment and an independent binding in an HttpOnly, path-restricted
        cookie. Both must match the same live PostgreSQL row. A successful
        exchange atomically creates a session and returns only the local user;
        the reusable credential is set only in an HttpOnly cookie. The same
        browser binding can recover the identical session for 60 seconds if a
        successful response is lost, without minting a second session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Authenticated
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /system/info:
    get:
      operationId: getSystemInfo
      tags: [System]
      summary: Read public build and capability information
      description: |
        Returns only public service metadata. Draft capability values are the
        effective administrator policy consumed by the web client.
      security: []
      responses:
        "200":
          description: Public service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /admin/settings/site:
    get:
      operationId: getSiteSettings
      tags: [Settings]
      summary: Read site and browser-draft policy
      description: Requires the `manage_settings` permission.
      responses:
        "200":
          description: Current site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateSiteSettings
      tags: [Settings]
      summary: Replace site and browser-draft policy
      description: |
        Requires `manage_settings`. Although the method is PATCH, the handler
        decodes a complete settings view over server defaults. Send every field
        to avoid unintentionally restoring an omitted value to its default.
        `public_base_url` cannot be cleared while Keycloak is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Normalized and stored site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /admin/operations:
    get:
      operationId: getAdminOperations
      tags: [Operations]
      summary: Read evidence-backed operational state
      description: |
        Requires `manage_system`. Database, migration, queue, webhook-delivery,
        and file-metadata values come from the current PostgreSQL state and
        selected storage runtime. A subsystem remains `unknown` when Moyro has
        no heartbeat or connection probe that can prove it healthy; an empty
        queue is not reported as a running worker.
      responses:
        "200":
          description: Current operational snapshot
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOperationsSnapshot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/flow-summary:
    get:
      operationId: getFlowSummary
      tags: [Flow]
      summary: Read the current user's Flow navigation model
      description: |
        Returns accessible teams, active team channels, membership counters,
        and up to six priority unread channels in one request. Browser sessions
        use their live memberships. Restricted API keys additionally require
        the current `mcp_read` grant and remain bounded by their team/channel
        scopes. Direct and group-message channels are not included in this read
        model.
      responses:
        "200":
          description: User-scoped Flow summary
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/activity-events:
    get:
      operationId: listActivityEvents
      tags: [Activity]
      summary: List durable activity inbox events
      description: |
        Events are always constrained to the authenticated owner. Channel-bound
        events disappear from subsequent reads if that user loses access to the
        channel. The cursor is opaque and orders rows by `(create_at, id)`
        descending. Repeated `type` parameters and comma-separated type values
        are both accepted.
      parameters:
        - $ref: "#/components/parameters/ActivityCursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: unread
          in: query
          schema: { type: boolean, default: false }
        - name: type
          in: query
          description: Event type filter; repeat the parameter to select several types.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ActivityEventType" }
      responses:
        "200":
          description: Cursor page of safe, owner-scoped activity views
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEventPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/activity-events/{eventID}:
    patch:
      operationId: updateActivityEventState
      tags: [Activity]
      summary: Update read, completed, or snooze state
      description: |
        Only the authenticated owner's row can be changed. Foreign and
        inaccessible channel events are returned as not found.
      parameters:
        - $ref: "#/components/parameters/EventID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityStatePatch"
      responses:
        "200":
          description: Updated activity event
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEvent"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/activity-events/mark-read:
    post:
      operationId: markActivityEventsRead
      tags: [Activity]
      summary: Mark several activity events read
      description: |
        Updates at most 200 owner-scoped events. Foreign, missing, or no-longer
        accessible event IDs are indistinguishable no-ops and are not included
        in the returned count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityMarkReadRequest"
      responses:
        "200":
          description: Number of rows newly marked read
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityMarkReadResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/work-items:
    get:
      operationId: listWorkItems
      tags: [Work items]
      summary: List accessible tasks and decisions
      description: |
        Tasks are visible only to their creator or current assignee. Decisions
        are visible to current members of the source channel. Removed channel
        membership removes both kinds from future reads. When `status` is
        supplied, a matching `kind` is required. The cursor is opaque and sorts
        by `(create_at, id)` descending.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/WorkItemKind" }
        - name: status
          in: query
          description: Must be valid for the accompanying kind.
          schema: { $ref: "#/components/schemas/WorkItemStatus" }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 1024 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
      responses:
        "200":
          description: Cursor page of work items
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createWorkItem
      tags: [Work items]
      summary: Create a task or record a decision from a message
      description: |
        The server derives team, channel, and root-thread scope from the live
        source post and rechecks source-channel membership. A task assignee must
        be an active channel member; an omitted task assignee defaults to the
        caller. Decisions reject assignee and due-date values.

        An idempotency key of 1–200 characters is required in either the
        `Idempotency-Key` header or `idempotency_key` body field. If both are
        sent they must match. Replaying the same actor/key with every durable
        input unchanged returns `200` and `replayed: true`; reuse for different
        input or a deleted item returns `409`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItem"
      responses:
        "201":
          description: Newly created work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkItemResult"
        "200":
          description: Idempotent replay of the original work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkItemResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/work-items/{workItemID}:
    patch:
      operationId: updateWorkItem
      tags: [Work items]
      summary: Update a task or decision
      description: |
        The creator can change owner-controlled fields. A current task assignee
        can change status only. Decisions remain creator-controlled. Guessed
        task IDs that are not visible to the caller are returned as not found.
      parameters:
        - $ref: "#/components/parameters/WorkItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWorkItem"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteWorkItem
      tags: [Work items]
      summary: Delete a work item
      description: Only the creator, while still a source-channel member, can delete it.
      parameters:
        - $ref: "#/components/parameters/WorkItemID"
      responses:
        "204":
          description: Work item deleted; no response body
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/approval-requests:
    get:
      operationId: listOwnApprovalRequests
      tags: [Approvals]
      summary: List approval requests submitted by the current user
      description: |
        Returns display-oriented projections. Durable execution payloads and
        producer-private credential metadata are never included.
      parameters:
        - $ref: "#/components/parameters/ApprovalStatus"
      responses:
        "200":
          description: Up to 100 approval request views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalRequestView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: submitApprovalRequest
      tags: [Approvals]
      summary: Submit a supported protected MCP write
      description: |
        Requires a currently valid scoped MCP key with `mcp_write` and
        `request_approval` in the destination channel. The supported actions
        are `mcp.create_post` and `mcp.reply_to_thread`. The response contains
        a safe preview only; the raw execution payload is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApprovalRequest"
      responses:
        "200":
          description: Approval requirement and optional safe request view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResultView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /reviews/approval-requests:
    get:
      operationId: listReviewApprovalRequests
      tags: [Approvals]
      summary: List approval requests the current principal can review
      description: |
        Team/channel scope and `review_approval` are evaluated for every row.
        Self-review exclusions configured by policy are also applied.
      parameters:
        - $ref: "#/components/parameters/ApprovalStatus"
      responses:
        "200":
          description: Up to 100 safe approval request views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalRequestView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /reviews/approval-requests/{requestID}/decision:
    post:
      operationId: decideApprovalRequest
      tags: [Approvals]
      summary: Approve or reject an in-scope request
      description: |
        Requires current `review_approval` in the request resource scope. An
        approved request is executed through the MCP approved-action path
        before the response is returned. The response remains the safe view
        without the raw durable payload.
      parameters:
        - $ref: "#/components/parameters/ApprovalRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Updated safe approval request view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT, PAT, or scoped Moyro API key
    browserSession:
      type: apiKey
      in: cookie
      name: moyro_browser_session
  parameters:
    EventID:
      name: eventID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkItemID:
      name: workItemID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ApprovalRequestID:
      name: requestID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ActivityCursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `next_cursor` by the preceding page.
      schema: { type: string, maxLength: 1024 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required here or in the body; if both are sent, values must match.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ApprovalStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [pending, approved, rejected, expired, executed]
  responses:
    BadRequest:
      description: Invalid query, JSON body, cursor, or domain input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, expired, invalid, or disallowed credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Current principal lacks the required permission or resource scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource is absent or intentionally hidden from this principal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Idempotency key conflicts with a different or deleted resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Server could not complete the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Required native service is not configured or available
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [id, message, status_code]
      properties:
        id: { type: string }
        message: { type: string }
        detailed_error: { type: string }
        request_id: { type: string }
        status_code: { type: integer, minimum: 400, maximum: 599 }
    LoginUser:
      type: object
      additionalProperties: false
      required: [id, username, email, roles, picture]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        roles: { type: string }
        picture: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        nickname: { type: string }
        position: { type: string }
    BrowserLoginSession:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/LoginUser" }
    SystemInfo:
      type: object
      required:
        - name
        - version
        - build_hash
        - build_date
        - oidc_enabled
        - approval_enabled
        - local_signup_enabled
        - capabilities
      properties:
        name: { type: string, const: moyro }
        version: { type: string }
        build_hash: { type: string }
        build_date: { type: string }
        oidc_enabled: { type: boolean }
        oidc_provider_name: { type: string }
        approval_enabled: { type: boolean }
        local_signup_enabled: { type: boolean }
        capabilities:
          $ref: "#/components/schemas/Capabilities"
    Capabilities:
      type: object
      required: [email_digest, drafts]
      properties:
        email_digest:
          type: object
          required: [configured, enabled]
          properties:
            configured: { type: boolean }
            enabled: { type: boolean }
        drafts:
          $ref: "#/components/schemas/DraftPolicy"
    DraftPolicy:
      type: object
      required: [storage_mode, retention_days, clear_on_logout]
      properties:
        storage_mode:
          type: string
          enum: [local, session, disabled]
          description: Browser persistence, current browser session only, or no local draft storage.
        retention_days: { type: integer, minimum: 1, maximum: 30, default: 7 }
        clear_on_logout: { type: boolean, default: true }
    SiteSettings:
      type: object
      required:
        - site_name
        - public_base_url
        - allowed_outgoing_hosts
        - trusted_proxy_cidrs
        - local_signup_enabled
        - draft_storage_mode
        - draft_retention_days
        - draft_clear_on_logout
      properties:
        site_name: { type: string, minLength: 1, maxLength: 80 }
        public_base_url:
          description: Empty or an absolute HTTP(S) origin without path, query, credentials, or fragment.
          oneOf:
            - { type: string, const: "" }
            - { type: string, format: uri, pattern: "^https?://" }
        allowed_outgoing_hosts:
          type: array
          maxItems: 256
          items:
            type: string
            description: Hostname or IP address without scheme, port, or path.
        trusted_proxy_cidrs:
          type: array
          maxItems: 64
          items:
            type: string
            description: Canonical IPv4 or IPv6 CIDR whose direct connections may supply forwarding headers.
        local_signup_enabled: { type: boolean }
        draft_storage_mode: { $ref: "#/components/schemas/DraftPolicy/properties/storage_mode" }
        draft_retention_days: { type: integer, minimum: 1, maximum: 30, default: 7 }
        draft_clear_on_logout: { type: boolean, default: true }
