openapi: 3.1.0
info:
  title: moyro MM Compatibility API
  version: 0.2.6
  description: |
    moyro v0.2.6의 Mattermost v4 호환 API 계약. 필드명과 경로는 Mattermost REST
    API v4와 최대한 일치시켜 기존 클라이언트·봇·플러그인의 이식성을 높인다.
    이 문서는 구현된 핵심 workflow를 명세하며 전체 route-shape 목록은
    mattermost-api-compatibility.md에서 별도로 관리한다. Moyro-native 관리·AI·MCP
    surface는 `/api/moyro/v1` 경계에 있고 이 호환 명세에 포함하지 않는다.
servers:
  - url: /api/v4
    description: 현재 Moyro 배포 origin의 Mattermost v4 호환 API
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [id, message, status_code]
      properties:
        id: { type: string }
        message: { type: string }
        detailed_error: { type: string }
        request_id: { type: string }
        status_code: { type: integer }
    User:
      type: object
      additionalProperties: false
      required: [id, username, email, roles, picture, guest_file_download]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        roles: { type: string }
        picture: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        nickname: { type: string }
        position: { type: string }
        guest_expires_at:
          type: integer
          format: int64
          minimum: 1
          description: 제한 게스트 계정의 Unix 밀리초 만료 시각. 일반 사용자는 생략된다.
        guest_file_download:
          type: boolean
          description: 제한 게스트가 원본 파일 바이트를 다운로드할 수 있는지 여부.
        delete_at: { type: integer, format: int64, minimum: 1 }
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: 공백을 제거하고 소문자로 정규화한 뒤 ASCII 사용자 이름 규칙을 적용한다.
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          description: UTF-8 기준 12–72바이트여야 한다.
        invite_id:
          type: string
          maxLength: 128
          description: 선택한 member 또는 restricted guest 초대를 원자적으로 소비한다.
    InviteKind:
      type: string
      enum: [member, guest]
    CreateTeamInvite:
      type: object
      additionalProperties: false
      properties:
        max_uses:
          type: integer
          maximum: 10000
          default: 0
          description: 0 이하 값은 만료 전까지 무제한 사용으로 정규화된다.
        ttl_seconds:
          type: integer
          maximum: 31536000
          default: 604800
          description: 0 이하 값은 기본 7일로 정규화된다.
        kind: { $ref: "#/components/schemas/InviteKind" }
        channel_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        guest_expires_after_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 31536000
        guest_file_download: { type: boolean, default: false }
      allOf:
        - if:
            properties:
              kind: { const: guest }
            required: [kind]
          then:
            required: [channel_ids, guest_expires_after_seconds]
            properties:
              channel_ids: { type: array, minItems: 1, maxItems: 100 }
              guest_expires_after_seconds:
                type: integer
                format: int64
                minimum: 3600
                maximum: 31536000
    TeamInvite:
      type: object
      additionalProperties: false
      required:
        - id
        - team_id
        - created_by
        - max_uses
        - use_count
        - expires_at
        - create_at
        - url
        - kind
        - channel_ids
        - guest_expires_after_seconds
        - guest_file_download
      properties:
        id: { type: string }
        team_id: { type: string }
        created_by: { type: string }
        max_uses: { type: integer, minimum: 0, maximum: 10000 }
        use_count: { type: integer, minimum: 0 }
        expires_at: { type: integer, format: int64, minimum: 1 }
        create_at: { type: integer, format: int64, minimum: 1 }
        url: { type: string }
        kind: { $ref: "#/components/schemas/InviteKind" }
        channel_ids:
          type: array
          maxItems: 100
          items: { type: string }
        guest_expires_after_seconds: { type: integer, format: int64, minimum: 0, maximum: 31536000 }
        guest_file_download: { type: boolean }
    PublicTeamInvite:
      type: object
      additionalProperties: false
      required:
        - id
        - team_id
        - team_display_name
        - team_name
        - expires_at
        - kind
        - channel_ids
        - guest_expires_after_seconds
        - guest_file_download
      properties:
        id: { type: string }
        team_id: { type: string }
        team_display_name: { type: string }
        team_name: { type: string }
        expires_at: { type: integer, format: int64, minimum: 1 }
        kind: { $ref: "#/components/schemas/InviteKind" }
        channel_ids:
          type: array
          maxItems: 100
          items: { type: string }
        guest_expires_after_seconds: { type: integer, format: int64, minimum: 0, maximum: 31536000 }
        guest_file_download: { type: boolean }
    LoginRequest:
      type: object
      required: [login_id, password]
      properties:
        login_id: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    Team:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        type: { type: string, enum: [O, I] }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    Channel:
      type: object
      properties:
        id: { type: string }
        team_id: { type: string }
        type: { type: string, enum: [O, P, D, G] }
        display_name: { type: string }
        name: { type: string }
        header: { type: string }
        purpose: { type: string }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    Post:
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        user_id: { type: string }
        root_id: { type: string }
        message: { type: string }
        props: { type: object, additionalProperties: true }
        file_ids:
          type: array
          items: { type: string }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    PostList:
      type: object
      properties:
        order:
          type: array
          items: { type: string }
        posts:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Post" }
    CreateTeam:
      type: object
      required: [name, display_name]
      properties:
        name: { type: string }
        display_name: { type: string }
        type: { type: string, default: O }
    CreateChannel:
      type: object
      required: [team_id, name, display_name]
      properties:
        team_id: { type: string }
        name: { type: string }
        display_name: { type: string }
        type: { type: string, default: O }
    CreatePost:
      type: object
      required: [channel_id, message]
      properties:
        channel_id: { type: string }
        message: { type: string }
        root_id: { type: string }
        props: { type: object, additionalProperties: true }
        file_ids:
          type: array
          items: { type: string }
    UpdatePost:
      type: object
      properties:
        id: { type: string }
        message: { type: string }
        props: { type: object, additionalProperties: true }
    Reaction:
      type: object
      required: [user_id, post_id, emoji_name]
      properties:
        user_id: { type: string }
        post_id: { type: string }
        emoji_name: { type: string }
        create_at: { type: integer, format: int64 }
    FileInfo:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        post_id: { type: string }
        channel_id: { type: string }
        name: { type: string }
        extension: { type: string }
        size: { type: integer, format: int64 }
        mime_type: { type: string }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    ChannelMember:
      type: object
      properties:
        channel_id: { type: string }
        user_id: { type: string }
        roles: { type: string }
        last_viewed_at: { type: integer, format: int64 }
        create_at: { type: integer, format: int64 }
    SearchPostsRequest:
      type: object
      required: [terms]
      properties:
        terms: { type: string }
        is_or_search: { type: boolean }
        per_page: { type: integer, default: 60 }
        page: { type: integer, default: 0 }
    Session:
      type: object
      description: 안전한 세션 관리 표현. JWT 원문과 jti 해시는 응답하지 않는다.
      required: [id, user_id, device_id, expires_at, create_at, is_current]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        device_id: { type: string }
        expires_at: { type: integer, format: int64 }
        create_at: { type: integer, format: int64 }
        is_current: { type: boolean }
    CreateScheduledPost:
      type: object
      required: [channel_id, send_at]
      anyOf:
        - required: [message]
        - required: [file_ids]
      properties:
        channel_id: { type: string }
        root_id: { type: string }
        message: { type: string }
        file_ids:
          type: array
          items: { type: string }
        props: { type: object, additionalProperties: true }
        send_at:
          type: integer
          format: int64
          description: 예약 발송 시각(ms Unix epoch)
    ScheduledPost:
      type: object
      required: [id, user_id, channel_id, message, file_ids, props, send_at, create_at, status, attempt_count]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        root_id: { type: string }
        message: { type: string }
        file_ids:
          type: array
          items: { type: string }
        props: { type: object, additionalProperties: true }
        send_at: { type: integer, format: int64 }
        create_at: { type: integer, format: int64 }
        sent_at: { type: integer, format: int64 }
        error_text: { type: string }
        status:
          type: string
          enum: [pending, processing, succeeded, retry, dead, cancelled]
        claimed_at: { type: integer, format: int64 }
        lease_until: { type: integer, format: int64 }
        attempt_count: { type: integer, minimum: 0 }
        next_attempt_at: { type: integer, format: int64 }
        last_error_code: { type: string }
        last_error_text: { type: string }
        result_post_id: { type: string }
    Plugin:
      type: object
      required: [id, version, state, enabled, runtime, error, manifest]
      properties:
        id: { type: string }
        version: { type: string }
        state:
          type: string
          enum: [installed, running, failed]
        enabled: { type: boolean }
        runtime:
          type: string
          enum: [moyro_v1, mattermost_v1]
        error: { type: string }
        manifest:
          type: object
          additionalProperties: true
    PluginInstallResult:
      type: object
      required: [id, version, state, enabled, runtime, sha256, replaced]
      properties:
        id: { type: string }
        version: { type: string }
        state:
          type: string
          enum: [installed, running, failed]
        enabled: { type: boolean }
        runtime:
          type: string
          enum: [mattermost_v1]
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        replaced: { type: boolean }
    PluginManagementCapabilities:
      type: object
      required: [management_enabled, uploads_enabled]
      properties:
        management_enabled: { type: boolean }
        uploads_enabled: { type: boolean }
    PluginStatus:
      type: object
      required: [plugin_id, state]
      properties:
        plugin_id: { type: string }
        state:
          type: string
          enum: [installed, running, failed]
    PluginConfiguration:
      type: object
      required: [configuration, schema]
      properties:
        configuration:
          type: object
          additionalProperties: true
        schema:
          type: object
          additionalProperties: true
    PluginConfigurationUpdate:
      type: object
      required: [configuration]
      properties:
        configuration:
          type: object
          additionalProperties: true
    PluginWebappBundle:
      type: object
      required: [id, version, url]
      properties:
        id: { type: string }
        version: { type: string }
        url:
          type: string
          pattern: "^/plugins/[A-Za-z0-9_.-]+/webapp\\.js$"
    StatusOK:
      type: object
      required: [status]
      properties:
        status: { type: string, const: OK }

paths:
  /system/ping:
    get:
      operationId: pingSystem
      security: []
      summary: Server liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /users:
    post:
      operationId: createUser
      security: []
      summary: Register a member or restricted guest account
      description: |
        Without `invite_id`, local signup must be enabled. With an invitation,
        invite consumption, user creation, account role, and invited team/channel
        memberships commit atomically; a race for the last use returns `400`
        without leaving a user row. Guest expiry and file-download policy come
        only from the validated invitation and are returned on the user object.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterUserRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Invalid registration input or invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Local registration is disabled and no invitation was supplied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Username or email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Account could not be created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Registration service is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invites/{inviteID}:
    parameters:
      - name: inviteID
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: previewTeamInvite
      security: []
      summary: Preview a live member or restricted guest invitation
      description: Returns only signup-safe team and access metadata; creator and usage counters are not exposed.
      responses:
        "200":
          description: Live invitation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTeamInvite" }
        "404":
          description: Invitation is absent, revoked, expired, exhausted, or its team is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /teams/invite/{inviteID}:
    parameters:
      - name: inviteID
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: previewTeamInviteAlias
      security: []
      summary: Preview a live invitation through the Mattermost-compatible alias
      responses:
        "200":
          description: Live invitation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTeamInvite" }
        "404":
          description: Invitation is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/login:
    post:
      operationId: loginUser
      security: []
      summary: Authenticate and receive a session token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: Authenticated
          headers:
            Token: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }

  /users/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/me/sessions:
    get:
      operationId: listCurrentUserSessions
      summary: List the caller's active sessions without bearer token material
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
    delete:
      operationId: revokeOtherCurrentUserSessions
      summary: Revoke every session except the authenticated session
      responses:
        "200":
          description: Revocation count
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  revoked: { type: integer, format: int64 }

  /users/me/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeCurrentUserSession
      summary: Revoke one session owned by the caller
      responses:
        "200":
          description: Idempotent result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  changed: { type: boolean }

  /teams:
    post:
      operationId: createTeam
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeam" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }

  /teams/{teamID}/invites:
    parameters:
      - name: teamID
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: listTeamInvites
      summary: List non-revoked member and restricted guest invitations
      description: Requires system administrator or administrator membership in the selected team.
      responses:
        "200":
          description: Invitations newest first; expired rows remain visible until revoked
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamInvite" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Team invitation administration is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Invitations could not be listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createTeamInvite
      summary: Create a member or channel-restricted guest invitation
      description: |
        Requires system administrator or administrator membership in the team.
        Guest invitations require one or more active public/private channels in
        this team and an access duration between one hour and one year. Member
        invitations ignore guest scope fields and always permit file downloads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamInvite" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamInvite" }
        "400":
          description: Invalid body, lifetime, usage limit, or guest channel scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Team invitation administration is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Invitation could not be created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/me/teams:
    get:
      operationId: listCurrentUserTeams
      summary: Teams for the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }

  /channels:
    post:
      operationId: createChannel
      summary: Create a channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannel" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }

  /users/me/teams/{teamID}/channels:
    parameters:
      - name: teamID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listCurrentUserTeamChannels
      summary: List channels for the user in a team
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }

  /posts:
    post:
      operationId: createPost
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePost" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }

  /scheduled_posts:
    post:
      operationId: createScheduledPost
      summary: Schedule a post for leased background delivery
      description: |
        The caller must still belong to the channel when creating the schedule.
        Workers claim rows with a lease and persist a unique scheduled-post result
        so retries cannot create a second post row. Post-commit notifications and
        integrations remain best-effort rather than a transactionally replayed lifecycle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduledPost" }
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledPost" }
        "400":
          description: Invalid body or time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a channel member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/me/scheduled_posts:
    get:
      operationId: listCurrentUserScheduledPosts
      summary: List mutable pending or retrying scheduled posts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduledPost" }

  /scheduled_posts/{scheduledID}:
    parameters:
      - name: scheduledID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteScheduledPost
      summary: Cancel a pending or retrying scheduled post owned by the caller
