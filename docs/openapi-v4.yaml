    get:
      operationId: getPluginConfiguration
      summary: Get effective plugin configuration and manifest schema (`manage_plugins`)
      responses:
        "200":
          description: Effective configuration and schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConfiguration" }
        "401":
          description: Missing or invalid session
          content:
