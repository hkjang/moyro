              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`manage_plugins` permission required"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Plugin is not installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Plugin install or replacement is in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Configuration could not be decrypted or read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Managed plugin runtime is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: updatePluginConfiguration
      summary: Encrypt, persist, and apply plugin configuration (`manage_plugins`)
      description: |
        The previous encrypted configuration is restored when the live plugin
        hook rejects the new value. If rollback or live reapply is uncertain,
        the managed runtime fails closed until the Moyro process is restarted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginConfigurationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOK" }
        "400":
          description: Invalid JSON configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`manage_plugins` permission required"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Plugin is not installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Plugin install or replacement is in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Encryption, persistence, or live configuration hook failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Managed plugin runtime is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plugins/{pluginID}/webapp.js:
    servers:
      - url: /
        description: Deployment origin; this route is outside `/api/v4`.
    get:
      operationId: getPluginWebappBundle
      summary: Fetch one authenticated web plugin JavaScript bundle
      parameters:
        - name: pluginID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: JavaScript bundle
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string, const: "private, max-age=300" }
          content:
            text/javascript:
              schema:
                type: string
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Bundle is absent or plugin is not enabled and running

  /plugins/{pluginID}/{pluginPath}:
    servers:
      - url: /
        description: Deployment origin; this route is outside `/api/v4`.
    description: |
      Catch-all plugin HTTP boundary. `pluginPath` represents the complete
      remainder after `/plugins/{pluginID}/` and may contain `/`. The runtime
      also dispatches the root `/plugins/{pluginID}/`. It accepts every HTTP
      method even though OpenAPI has no standard catch-all method operation.
      Authentication is optional so a plugin can implement
      its own token; a supplied Moyro bearer/PAT must validate. Moyro strips
      `Authorization` and client-supplied `Mattermost-User-ID`, then injects a
      verified `Mattermost-User-ID` when authenticated. The plugin owns
      endpoint-level authorization. Request bodies are limited to 8 MiB.
    x-moyro-catch-all-methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    parameters:
      - name: pluginID
        in: path
        required: true
        schema: { type: string }
      - name: pluginPath
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: callPluginHTTP
      summary: Dispatch a request to a running plugin HTTP handler
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Plugin-defined response; status, headers, and body vary
        "401":
          description: A supplied Moyro credential was invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Plugin is absent, disabled, not running, or has no HTTP hook
        "502":
          description: Moyro native RPC plugin HTTP call failed

  /websocket:
    get:
      operationId: connectWebSocket
      summary: WebSocket upgrade endpoint
      security: []
      description: |
        Upgrades without an HTTP bearer token, then authenticates with the
        first `authentication_challenge` frame. Events follow the Mattermost envelope:
        `{ event, data, broadcast, seq }`. Core events:

        - `posted` — new post in channel. `data.post` is a stringified Post JSON.
          `data.mentions` is a stringified JSON array of user IDs referenced with @.
        - `post_edited` — message/props of an existing post changed.
        - `post_deleted` — soft-delete broadcast.
        - `typing` — another user is typing in a channel (fanned to channel members, omits the author).
        - `user_added` / `user_removed` — channel membership changes.
        - `reaction_added` / `reaction_removed` — reaction lifecycle on a post.
        - `mention` — direct fan-out to each mentioned user (notification hook).

        Client-to-server actions (`{seq, action, data}`):

        - `user_typing` — client announces it is typing. `data.channel_id` required, `data.parent_id` optional.
      responses:
        "101": { description: Switching Protocols }
