openapi: 3.1.0
info:
  title: moyro MM Compatibility API
  version: 0.1.1
  description: |
    moyro v0.1.1의 Mattermost v4 호환 API 계약. 필드명과 경로는 Mattermost REST
    API v4와 최대한 일치시켜 기존 클라이언트·봇·플러그인의 이식성을 높인다.
    이 문서는 구현된 핵심 workflow를 명세하며 전체 route-shape 목록은
    mattermost-api-compatibility.md에서 별도로 관리한다. Moyro-native 관리·AI·MCP
    surface는 `/api/moyro/v1` 경계에 있고 이 호환 명세에 포함하지 않는다.
servers:
  - url: /api/v4
    description: 현재 Moyro 배포 origin의 Mattermost v4 호환 API
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [id, message, status_code]
      properties:
        id: { type: string }
        message: { type: string }
        detailed_error: { type: string }
        request_id: { type: string }
        status_code: { type: integer }
    User:
      type: object
      required: [id, username, email]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        roles: { type: string }
    LoginRequest:
      type: object
      required: [login_id, password]
      properties:
        login_id: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    Team:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        type: { type: string, enum: [O, I] }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    Channel:
      type: object
      properties:
        id: { type: string }
        team_id: { type: string }
        type: { type: string, enum: [O, P, D, G] }
        display_name: { type: string }
        name: { type: string }
        header: { type: string }
        purpose: { type: string }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    Post:
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        user_id: { type: string }
        root_id: { type: string }
        message: { type: string }
        props: { type: object, additionalProperties: true }
        file_ids:
          type: array
          items: { type: string }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    PostList:
      type: object
      properties:
        order:
          type: array
          items: { type: string }
        posts:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Post" }
    CreateTeam:
      type: object
      required: [name, display_name]
      properties:
        name: { type: string }
        display_name: { type: string }
        type: { type: string, default: O }
    CreateChannel:
      type: object
      required: [team_id, name, display_name]
      properties:
        team_id: { type: string }
        name: { type: string }
        display_name: { type: string }
        type: { type: string, default: O }
    CreatePost:
      type: object
      required: [channel_id, message]
      properties:
        channel_id: { type: string }
        message: { type: string }
        root_id: { type: string }
        props: { type: object, additionalProperties: true }
        file_ids:
          type: array
          items: { type: string }
    UpdatePost:
      type: object
      properties:
        id: { type: string }
        message: { type: string }
        props: { type: object, additionalProperties: true }
    Reaction:
      type: object
      required: [user_id, post_id, emoji_name]
      properties:
        user_id: { type: string }
        post_id: { type: string }
        emoji_name: { type: string }
        create_at: { type: integer, format: int64 }
    FileInfo:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        post_id: { type: string }
        channel_id: { type: string }
        name: { type: string }
        extension: { type: string }
        size: { type: integer, format: int64 }
        mime_type: { type: string }
        create_at: { type: integer, format: int64 }
        update_at: { type: integer, format: int64 }
        delete_at: { type: integer, format: int64 }
    ChannelMember:
      type: object
      properties:
        channel_id: { type: string }
        user_id: { type: string }
        roles: { type: string }
        last_viewed_at: { type: integer, format: int64 }
        create_at: { type: integer, format: int64 }
    SearchPostsRequest:
      type: object
      required: [terms]
      properties:
        terms: { type: string }
        is_or_search: { type: boolean }
        per_page: { type: integer, default: 60 }
        page: { type: integer, default: 0 }
    Session:
      type: object
      description: 안전한 세션 관리 표현. JWT 원문과 jti 해시는 응답하지 않는다.
      required: [id, user_id, device_id, expires_at, create_at, is_current]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        device_id: { type: string }
        expires_at: { type: integer, format: int64 }
        create_at: { type: integer, format: int64 }
        is_current: { type: boolean }
    CreateScheduledPost:
      type: object
      required: [channel_id, send_at]
      anyOf:
        - required: [message]
        - required: [file_ids]
      properties:
        channel_id: { type: string }
        root_id: { type: string }
        message: { type: string }
        file_ids:
          type: array
          items: { type: string }
        props: { type: object, additionalProperties: true }
        send_at:
          type: integer
          format: int64
          description: 예약 발송 시각(ms Unix epoch)
    ScheduledPost:
      type: object
      required: [id, user_id, channel_id, message, file_ids, props, send_at, create_at, status, attempt_count]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        root_id: { type: string }
        message: { type: string }
        file_ids:
          type: array
          items: { type: string }
        props: { type: object, additionalProperties: true }
        send_at: { type: integer, format: int64 }
        create_at: { type: integer, format: int64 }
        sent_at: { type: integer, format: int64 }
        error_text: { type: string }
        status:
          type: string
          enum: [pending, processing, succeeded, retry, dead, cancelled]
        claimed_at: { type: integer, format: int64 }
        lease_until: { type: integer, format: int64 }
        attempt_count: { type: integer, minimum: 0 }
        next_attempt_at: { type: integer, format: int64 }
        last_error_code: { type: string }
        last_error_text: { type: string }
        result_post_id: { type: string }
    Plugin:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        state: { type: string }
        manifest: { type: object }

paths:
  /system/ping:
    get:
      operationId: pingSystem
      security: []
      summary: Server liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /users:
    post:
      operationId: createUser
      security: []
      summary: Create (register) a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/login:
    post:
      operationId: loginUser
      security: []
      summary: Authenticate and receive a session token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: Authenticated
          headers:
            Token: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }

  /users/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /users/me/sessions:
    get:
      operationId: listCurrentUserSessions
      summary: List the caller's active sessions without bearer token material
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
    delete:
      operationId: revokeOtherCurrentUserSessions
      summary: Revoke every session except the authenticated session
      responses:
        "200":
          description: Revocation count
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  revoked: { type: integer, format: int64 }

  /users/me/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeCurrentUserSession
      summary: Revoke one session owned by the caller
      responses:
        "200":
          description: Idempotent result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  changed: { type: boolean }

  /teams:
    post:
      operationId: createTeam
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeam" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }

  /users/me/teams:
    get:
      operationId: listCurrentUserTeams
      summary: Teams for the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }

  /channels:
    post:
      operationId: createChannel
      summary: Create a channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannel" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }

  /users/me/teams/{teamID}/channels:
    parameters:
      - name: teamID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listCurrentUserTeamChannels
      summary: List channels for the user in a team
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }

  /posts:
    post:
      operationId: createPost
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePost" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }

  /scheduled_posts:
    post:
      operationId: createScheduledPost
      summary: Schedule a post for leased background delivery
      description: |
        The caller must still belong to the channel when creating the schedule.
        Workers claim rows with a lease and persist a unique scheduled-post result
        so retries cannot create a second post row. Post-commit notifications and
        integrations remain best-effort rather than a transactionally replayed lifecycle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduledPost" }
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledPost" }
        "400":
          description: Invalid body or time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a channel member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/me/scheduled_posts:
    get:
      operationId: listCurrentUserScheduledPosts
      summary: List mutable pending or retrying scheduled posts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduledPost" }

  /scheduled_posts/{scheduledID}:
    parameters:
      - name: scheduledID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteScheduledPost
      summary: Cancel a pending or retrying scheduled post owned by the caller
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }
        "404":
          description: Missing, already claimed, or already delivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /channels/{channelID}/posts:
    parameters:
      - name: channelID
        in: path
        required: true
        schema: { type: string }
      - name: page
        in: query
        schema: { type: integer, default: 0 }
      - name: per_page
        in: query
        schema: { type: integer, default: 60, maximum: 200 }
    get:
      operationId: listChannelPosts
      summary: List posts in a channel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }

  /posts/{postID}:
    parameters:
      - name: postID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updatePost
      summary: Update (edit) a post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePost" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
    delete:
      operationId: deletePost
      summary: Soft-delete a post
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }

  /teams/{teamID}/posts/search:
    parameters:
      - name: teamID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: searchTeamPosts
      summary: Full-text search posts visible to the caller in a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchPostsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }

  /reactions:
    post:
      operationId: createReaction
      summary: Add a reaction to a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id, emoji_name]
              properties:
                post_id: { type: string }
                emoji_name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reaction" }

  /posts/{postID}/reactions:
    parameters:
      - name: postID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listPostReactions
      summary: List reactions on a post
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reaction" }

  /users/{userID}/posts/{postID}/reactions/{emoji}:
    parameters:
      - name: userID
        in: path
        required: true
        schema: { type: string }
      - name: postID
        in: path
        required: true
        schema: { type: string }
      - name: emoji
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteReaction
      summary: Remove a reaction (caller's only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }

  /files:
    post:
      operationId: uploadFiles
      summary: Upload one or more files for later post attachment
      parameters:
        - name: channel_id
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                client_ids:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_infos:
                    type: array
                    items: { $ref: "#/components/schemas/FileInfo" }
                  client_ids:
                    type: array
                    items: { type: string }

  /files/{fileID}:
    parameters:
      - name: fileID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadFile
      summary: Download a file
      responses:
        "200":
          description: Binary payload
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /files/{fileID}/info:
    parameters:
      - name: fileID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getFileInfo
      summary: File metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileInfo" }

  /channels/{channelID}/members:
    parameters:
      - name: channelID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listChannelMembers
      summary: List channel members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelMember" }
    post:
      operationId: addChannelMember
      summary: Invite (add) a user to a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelMember" }

  /channels/{channelID}/members/{userID}:
    parameters:
      - name: channelID
        in: path
        required: true
        schema: { type: string }
      - name: userID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteChannelMember
      summary: Remove a channel member (self-leave or admin kick)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }

  /users/logout:
    post:
      operationId: logoutUser
      summary: Revoke the caller's current session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string } }

  /plugins:
    get:
      operationId: listPlugins
      summary: List installed plugins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plugin" }

  /websocket:
    get:
      operationId: connectWebSocket
      summary: WebSocket upgrade endpoint
      security: []
      description: |
        Upgrades without an HTTP bearer token, then authenticates with the
        first `authentication_challenge` frame. Events follow the Mattermost envelope:
        `{ event, data, broadcast, seq }`. Core events:

        - `posted` — new post in channel. `data.post` is a stringified Post JSON.
          `data.mentions` is a stringified JSON array of user IDs referenced with @.
        - `post_edited` — message/props of an existing post changed.
        - `post_deleted` — soft-delete broadcast.
        - `typing` — another user is typing in a channel (fanned to channel members, omits the author).
        - `user_added` / `user_removed` — channel membership changes.
        - `reaction_added` / `reaction_removed` — reaction lifecycle on a post.
        - `mention` — direct fan-out to each mentioned user (notification hook).

        Client-to-server actions (`{seq, action, data}`):

        - `user_typing` — client announces it is typing. `data.channel_id` required, `data.parent_id` optional.
      responses:
        "101": { description: Switching Protocols }
