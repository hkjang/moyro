  /plugins:
    get:
      operationId: listPlugins
      summary: List installed plugins (`manage_plugins`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plugin" }
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`manage_plugins` permission required"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: installPlugin
      summary: Upload, validate, install, and activate a Mattermost plugin archive
      description: |
        Requires `manage_plugins`. Accepts either multipart field `plugin` or a
        raw gzip-compressed tar body. A runtime upload is installed as
        `mattermost_v1`. Existing installations require `force=true`; the
        implementation also accepts `replace=true` as a compatibility alias.
        Install and replacement use a durable PostgreSQL rollback marker; a
        candidate is not exposed until activation, old-generation call drain,
        and metadata commit finish. Archive structure is validated, but plugin
        code signatures and publisher identity are not; installed bundles are
        fully trusted native code.
      parameters:
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: replace
          in: query
          required: false
          deprecated: true
          description: Compatibility alias for `force`.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [plugin]
              properties:
                plugin:
                  type: string
                  format: binary
          application/gzip:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Plugin installed and activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginInstallResult" }
        "400":
          description: Malformed, unsafe, oversized, or incompatible archive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`manage_plugins` permission required"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Plugin already exists without force, or the current generation could not drain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Managed plugin runtime is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

